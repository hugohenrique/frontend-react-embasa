  <title>Exercício 3 — Contador de caracteres</title>

    textarea { width: 100%; padding: 10px 12px; border: 1px solid #A9B6C3; border-radius: 6px; font: inherit; }

    .contador { margin: 4px 0 0; color: #5B6878; font-size: .875rem; text-align: right; }
    .alerta { color: #B3261E; font-weight: 700; }

  <label for="descricao">Descrição do problema</label>
  <textarea id="descricao" rows="6" maxlength="500" aria-describedby="contador"></textarea>
  <p id="contador" class="contador">0 de 500 caracteres</p>
